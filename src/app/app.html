<div class="container mt-3">
<h1 class="text-primary">Usuarios</h1>
@if(users().length > 0){
  <table class="table table-striped table-bordered">
    <thead>
    <tr>
      <th>Id</th>
      <th>Name</th>
      <th>Address</th>
      <th>Company</th>
    </tr>
    </thead>
    <tbody>
    @for (user of users(); track $index) {
      <tr>
        <td>{{user.id}}</td>
        <td>{{user.name}}</td>
        <td>C/{{user.address.street}}, {{user.address.suite}},<br> {{user.address.city}} {{user.address.zipcode}}</td>
        <td>{{user.company.name}}</td>
      </tr>
    }
    </tbody>
  </table>
}
@else{
  <p>Esperando datos...</p>
}
</div>
