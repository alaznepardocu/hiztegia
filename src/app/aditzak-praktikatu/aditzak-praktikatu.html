<div class="d-flex justify-content-center mx-3">
    <div class="container w-80 text-center">
        @switch (pantalla()) {
            @case ('cargando') {
                <p>Cargando Aditzak...</p>
            }
            @case ('filtros') {
                <app-aditzak-praktikatu-filtros (empezar)="empezar($event)" />
            }
            @case ('practicando') {
                <app-aditzak-praktikatu-practica
                    [aditzak]="aditzakAEstudiar"
                    (reset)="reset()" />
            }
        }
    </div>
</div>
