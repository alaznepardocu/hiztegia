<div class="d-flex justify-content-center mx-3">
    <div class="container w-100">
        @switch (pantalla()) {
            @case ('cargando') {
                <p class="text-center">Cargando Hiztegia...</p>
            }
            @case ('filtros') {
                <app-hiztegia-praktikatu-filtros
                    (empezar)="empezarPractica($event)" />
            }
            @case ('practicando') {
                <app-hiztegia-praktikatu-practica
                    [modo]="sesionPractica.modo"
                    [palabrasAEstudiar]="sesionPractica.palabras"
                    (reset)="reset()" />
            }
        }
    </div>
</div>
